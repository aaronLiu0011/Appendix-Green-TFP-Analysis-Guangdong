[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfp-sbm"
version = "0.1.0"
description = "Open-source undesirable-output SBM and Malmquist-Luenberger calculation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "deapack>=2.0.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
gtfp-sbm = "gtfp_sbm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
